[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/test-shell-mobile/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
tauri = "=2.12.6"
tauri-build = "=2.7.5"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["sync"] }
tauri-plugin-dialog = "=2.8.4"
gtk = "=0.18.2"
webview2-com = "=0.39.1"
ashpd = "=0.14.0"
futures-util = "=0.3.34"
objc2 = "=0.6.5"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
block2 = "=0.6.2"
windows = { version = "=0.62.2", features = ["Foundation", "UI_ViewManagement"] }
