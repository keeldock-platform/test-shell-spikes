"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-current-accent"
description = "Allow reading the synthetic Android system-accent snapshot."
commands.allow = ["current_accent"]

[[permission]]
identifier = "allow-accent-listeners"
description = "Allow subscribing to and removing the synthetic Android accent event listener."
commands.allow = ["register_listener", "registerListener", "remove_listener"]
